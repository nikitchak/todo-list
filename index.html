<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Список задач</title>
  <meta name="description" content="Простой список задач: добавление, отметка, удаление, сохранение в браузере.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232D6A4F'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
  <link rel="stylesheet" href="style.css">

  <!-- Тема применяется до отрисовки, чтобы не было вспышки светлого фона -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('todo-list.theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div>
        <h1 class="app-title">Список задач</h1>
        <p class="app-date" id="today"></p>
      </div>
      <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Включить тёмную тему">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <section class="progress" aria-label="Прогресс">
      <div class="progress-track" id="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="progress-text">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-text" id="progress-text">Задач пока нет</p>
    </section>

    <form class="composer" id="add-form" novalidate>
      <label class="visually-hidden" for="new-task">Новая задача</label>
      <input class="composer-input" id="new-task" type="text" placeholder="Что нужно сделать?" maxlength="200" autocomplete="off" aria-describedby="form-error">

      <div class="composer-options">
        <fieldset class="priority-picker">
          <legend class="visually-hidden">Приоритет</legend>
          <label class="priority-option" data-priority="low">
            <input type="radio" name="priority" value="low"><span>Низкий</span>
          </label>
          <label class="priority-option" data-priority="medium">
            <input type="radio" name="priority" value="medium" checked><span>Обычный</span>
          </label>
          <label class="priority-option" data-priority="high">
            <input type="radio" name="priority" value="high"><span>Высокий</span>
          </label>
        </fieldset>

        <label class="due-field">
          <span>Срок</span>
          <input type="date" id="new-due" name="due">
        </label>

        <button class="button-primary" type="submit">Добавить</button>
      </div>

      <p class="form-error" id="form-error" aria-live="polite"></p>
    </form>

    <section class="tasks" aria-labelledby="tasks-heading">
      <h2 class="visually-hidden" id="tasks-heading">Задачи</h2>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Показать задачи">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">Все <span class="filter-count" data-count="all">0</span></button>
          <button class="filter" type="button" data-filter="active" aria-pressed="false">Активные <span class="filter-count" data-count="active">0</span></button>
          <button class="filter" type="button" data-filter="done" aria-pressed="false">Выполненные <span class="filter-count" data-count="done">0</span></button>
        </div>

        <div class="search">
          <label class="visually-hidden" for="search">Поиск по задачам</label>
          <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Поиск" autocomplete="off">
          <kbd class="search-hint" aria-hidden="true">/</kbd>
        </div>
      </div>

      <ul class="task-list" id="task-list" aria-label="Список задач"></ul>
      <p class="empty-state" id="empty-state" hidden></p>

      <div class="list-footer" id="list-footer" hidden>
        <p id="remaining" aria-live="polite"></p>
        <button class="button-link" id="clear-completed" type="button">Очистить выполненные</button>
      </div>
    </section>

    <footer class="app-footer">
      <p>Задачи хранятся в этом браузере. Дважды щёлкните по задаче, чтобы изменить текст. Клавиша <kbd>/</kbd> открывает поиск, <kbd>Esc</kbd> отменяет.</p>
      <p class="storage-warning" id="storage-warning" hidden></p>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button class="toast-action" id="toast-undo" type="button">Отменить</button>
  </div>

  <template id="task-template">
    <li class="task">
      <button class="task-handle" type="button" title="Перетащите, чтобы изменить порядок (или стрелки ↑↓)">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></g></svg>
      </button>
      <label class="task-check">
        <input class="task-toggle" type="checkbox">
        <span class="checkmark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </label>
      <div class="task-body">
        <span class="task-text"></span>
        <div class="task-meta">
          <span class="task-priority"></span>
          <span class="task-due" hidden></span>
        </div>
      </div>
      <div class="task-actions">
        <button class="icon-button task-edit" type="button" title="Редактировать">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-button task-delete" type="button" title="Удалить">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
    </li>
  </template>

  <script src="todo-core.js"></script>
  <script src="app.js"></script>
</body>
</html>
